name: APK bauen

on:
  push:
    branches: [main, master, "dev/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Bildschirme rendern
        run: gradle :app:testDebugUnitTest --tests "*ShotsTest" --no-daemon

      - name: Bilder ablegen
        if: always()
        run: |
          cd app/build/shots || exit 0
          git init -q -b shots-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Bildschirme"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots-out
